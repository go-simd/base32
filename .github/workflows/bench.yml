name: bench
# Native amd64 throughput on ubuntu-latest. The dev machine is arm64, so the
# amd64 kernels only run under Rosetta / a QEMU VM locally (unrepresentative);
# this job produces representative native numbers for the README Performance
# table.
on:
  push:
    branches: [main, bench]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest # native amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: grep -m1 -oE 'avx2|avx512[a-z]+' /proc/cpuinfo | sort -u | tr "\n" " "; echo
      - name: go env
        run: go env GOARCH GOAMD64
      - name: benchmark encode + decode
        run: go test -run '^$' -bench 'Encode|Decode' -benchmem -count=6 ./...
